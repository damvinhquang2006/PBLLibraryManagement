<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Khách - Hệ thống PBL</title>
    <link rel="stylesheet" href="../css/Dashboard.css">
    <link rel="stylesheet" href="../css/DashboardExt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fas fa-book-open"></i>
            <div>
                <h1>Hệ thống PBL</h1>
                <p>Project-Based Learning Portal</p>
            </div>
        </div>
        <div class="user-email">
            <i class="fas fa-user-circle"></i> Khách
        </div>
    </header>

    <main class="container">
        <div class="welcome-text">
            <h2>Dashboard Khách</h2>
            <p>Chào mừng bạn đến với Hệ thống PBL</p>
        </div>

        <div class="card-grid">
            <div class="card clickable" onclick="window.location.href='#'">
                <div class="icon-box blue"><i class="fas fa-columns"></i></div>
                <h3>Thư viện PBL</h3>
                <p>Truy cập tài liệu, mẫu dự án và tài nguyên học tập</p>
            </div>

            <div class="card clickable account-card" onclick="window.location.href='login.html'">
                <div class="icon-box gray"><i class="fas fa-sign-in-alt"></i></div>
                <h3>Đăng nhập tài khoản</h3>
                <p>Đăng nhập để sử dụng đầy đủ các tính năng của hệ thống</p>
            </div>
        </div>
    </main>

</body>
</html>
