<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không gian lớp học - Sinh viên</title>
    <link rel="stylesheet" href="../css/Dashboard.css">
    <link rel="stylesheet" href="../css/DashboardExt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-book-open"></i>
            <div>
                <h1>Hệ thống PBL</h1>
                <p>Project-Based Learning Portal</p>
            </div>
        </div>
        <div class="user-email">
            <i class="fas fa-user-circle"></i> nguyennhuquynh.bkdn@gmail.com
        </div>
    </header>

    <main class="container">
        <div class="class-header">
            <a href="DashboardSV.html" class="back-btn"><i class="fas fa-arrow-left"></i> Quay lại</a>
            <h2>Không gian lớp học: Lập trình PBL</h2>
            <div></div> <!-- space filler -->
        </div>

        <div class="card-grid">
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-users"></i></div>
                <h3>Danh sách sinh viên</h3>
            </div>
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-user-friends"></i></div>
                <h3>Tạo/ tham gia nhóm</h3>
            </div>
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-edit"></i></div>
                <h3>Đăng ký đề tài PBL</h3>
            </div>
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-calendar-alt"></i></div>
                <h3>Theo dõi kế hoạch</h3>
            </div>
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-file-upload"></i></div>
                <h3>Nộp báo cáo tiến độ</h3>
            </div>
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-file-archive"></i></div>
                <h3>Nộp báo cáo PBL cuối kỳ</h3>
            </div>
            <div class="card clickable">
                <div class="icon-box blue"><i class="fas fa-star"></i></div>
                <h3>Xem kết quả đánh giá</h3>
            </div>
        </div>
    </main>
</body>
</html>
