<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống PBL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-card">
        <div class="logo-box"><i class="bi bi-lock"></i></div>
        <h2 class="title-dangnhap text-center">Đăng nhập</h2>
        <h6 class="text-secondary text-center mb-4">Hệ thống PBL</h6>

        <label class="form-label text-secondary">Vai trò</label>
        <div class="d-flex gap-3 mb-4">
            <div class="role-option active" id="roleSV" onclick="selectRole('SV')">
                <i class="bi bi-mortarboard role-icon"></i>
                <div>Sinh viên</div>
            </div>
            <div class="role-option" id="roleGV" onclick="selectRole('GV')">
                <i class="bi bi-people role-icon"></i>
                <div>Giảng viên</div>
            </div>
            <div class="role-option" id="roleAD" onclick="selectRole('AD')"> 
                 <i class="bi bi-person-gear role-icon"></i>
                 <div>Admin</div>
             </div>
        </div>

        <form id="loginForm">
            <input type="hidden" id="selectedRole" name="role" value="SV">
            
            <div class="mb-3">
                <label for="inputMaUser" class="form-label text-secondary">Tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control" id="inputMaUser" name="username" placeholder="102240400" required>
                </div>
            </div>

            <div class="mb-5">
                <label for="inputPassword" class="form-label text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="inputPassword" name="password" placeholder="........" required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-dangnhap btn-lg">Đăng nhập</button>
            </div>
        </form>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
