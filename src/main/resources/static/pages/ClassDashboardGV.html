<!DOCTYPE html>
<html lang="vi">
<head>

    <link rel="stylesheet" href="../css/Dashboard.css">

<body>
    <header class="navbar">

            <div>
                <h1>Hệ thống PBL</h1>

            </div>
        </div>
        <div class="user-email">
            <i class="fas fa-user-tie"></i> giangvien@gmail.com
        </div>

    <main class="container">
        <div class="class-header">

            <h2>Không gian lớp: 24T_DT01</h2>
