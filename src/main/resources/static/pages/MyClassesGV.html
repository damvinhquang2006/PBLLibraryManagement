<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách lớp PBL - Giảng viên</title>
    <link rel="stylesheet" href="../css/Dashboard.css">
    <link rel="stylesheet" href="../css/DashboardExt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-book-open"></i>
            <div>
                <h1>Hệ thống PBL</h1>
                <p>Project-Based Learning Portal</p>
            </div>
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Tìm kiếm lớp học PBL...">
        </div>
        <div class="user-email">
            <i class="fas fa-user-tie"></i> giangvien@gmail.com
        </div>
    </header>

    <main class="container">
        <div class="class-header">
            <a href="DashboardGV.html" class="back-btn"><i class="fas fa-arrow-left"></i> Quay lại Dashboard</a>
            <h2>Các lớp đang hướng dẫn</h2>
            <div></div> <!-- space filler -->
        </div>

        <div class="card-grid">
            <div class="card clickable" onclick="window.location.href='ClassDashboardGV.html'">
                <div class="icon-box blue"><i class="fas fa-laptop-code"></i></div>
                <h3>24.Nh10A</h3>
                <p>Đề tài: Ứng dụng quản lý thư viện</p>
            </div>
            <div class="card clickable" onclick="window.location.href='ClassDashboardGV.html'">
                <div class="icon-box blue"><i class="fas fa-microchip"></i></div>
                <h3>24.Nh10B</h3>
                <p>Đề tài: Hệ thống nhúng IoT</p>
            </div>
            <div class="card clickable" onclick="window.location.href='ClassDashboardGV.html'">
                <div class="icon-box blue"><i class="fas fa-database"></i></div>
                <h3>24.Nh10C</h3>
                <p>Đề tài: Phân tích dữ liệu lớn</p>
            </div>
        </div>
    </main>
</body>
</html>
